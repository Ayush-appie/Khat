<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khat - KIIT Community Forum</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e1217;
      --panel: #1a1a1b;
      --hover: #272729;
      --border: #343536;
      --text: #d7dadc;
      --text-muted: #818384;
      --primary: #ff4500;
      --primary-hover: #ff5700;
      --upvote: #ff8b60;
      --downvote: #9494ff;
      --green: #46d160;
      --danger: #ea0027;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .hidden { display: none !important; }
    
    /* AUTH SCREEN */
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0e1217 0%, #1a1a1b 100%);
    }
    .auth-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
    }
    .auth-logo {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      text-align: center;
    }
    .auth-subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 30px;
      font-size: 14px;
    }
    .auth-input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
    }
    .auth-input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .auth-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-btn-primary {
      background: var(--primary);
      color: white;
    }
    .auth-btn-primary:hover {
      background: var(--primary-hover);
    }
    .auth-btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .auth-btn-secondary:hover {
      background: var(--hover);
    }
    .auth-status {
      text-align: center;
      font-size: 13px;
      margin: 10px 0;
      min-height: 20px;
    }
    .auth-toggle {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .auth-toggle a {
      color: var(--primary);
      cursor: pointer;
      text-decoration: none;
    }
    .auth-toggle a:hover {
      text-decoration: underline;
    }

    /* USERNAME SELECTION */
    .username-setup {
      text-align: center;
    }
    .username-setup h2 {
      margin-bottom: 10px;
      font-size: 24px;
    }
    .username-setup p {
      color: var(--text-muted);
      margin-bottom: 20px;
      font-size: 14px;
    }

    /* MAIN APP LAYOUT */
    .app-container {
      display: flex;
      min-height: 100vh;
    }
    
    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      padding: 16px 8px;
    }
    .sidebar::-webkit-scrollbar {
      width: 8px;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    .sidebar-logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      padding: 8px 12px;
      margin-bottom: 20px;
    }
    .sidebar-section {
      margin-bottom: 20px;
    }
    .sidebar-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 8px 12px;
      letter-spacing: 0.5px;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      margin: 2px 0;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }
    .sidebar-item:hover {
      background: var(--hover);
      color: var(--text);
    }
    .sidebar-item.active {
      background: var(--hover);
      color: var(--text);
      border-left: 3px solid var(--primary);
    }
    .sidebar-icon {
      margin-right: 12px;
      font-size: 20px;
    }
    .sidebar-search {
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 13px;
    }

    /* MAIN CONTENT */
    .main-content {
      margin-left: 260px;
      flex: 1;
      max-width: 1200px;
    }

    /* HEADER */
    .header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-community {
      font-size: 18px;
      font-weight: 600;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-user {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--hover);
      border-radius: 4px;
      font-size: 14px;
    }
    .mod-badge {
      background: var(--green);
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .btn-logout {
      padding: 6px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-logout:hover {
      background: var(--hover);
    }

    /* POST CREATION */
    .create-post {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 16px;
      margin: 16px 20px;
    }
    .create-post-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .create-post-avatar {
      width: 38px;
      height: 38px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
    }
    .create-post-input {
      flex: 1;
      padding: 10px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
    }
    .create-post-body {
      display: none;
      margin-top: 12px;
    }
    .create-post-body.active {
      display: block;
    }
    .create-post-select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
    }
    .create-post-textarea {
      width: 100%;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
      resize: vertical;
      min-height: 120px;
      margin-bottom: 12px;
    }
    .create-post-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .btn-post {
      padding: 8px 24px;
      background: var(--primary);
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-post:hover {
      background: var(--primary-hover);
    }
    .btn-cancel {
      padding: 8px 24px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }
    .btn-cancel:hover {
      background: var(--hover);
    }

    /* POSTS FEED */
    .posts-feed {
      padding: 0 20px 20px;
    }
    .post-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 10px;
      display: flex;
      transition: border-color 0.2s;
    }
    .post-card:hover {
      border-color: var(--text-muted);
    }
    .post-vote {
      width: 40px;
      background: var(--bg);
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border-radius: 4px 0 0 4px;
    }
    .vote-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: var(--text-muted);
      padding: 4px;
      line-height: 1;
    }
    .vote-btn:hover {
      color: var(--text);
    }
    .vote-btn.upvoted {
      color: var(--upvote);
    }
    .vote-btn.downvoted {
      color: var(--downvote);
    }
    .vote-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }
    .post-content {
      flex: 1;
      padding: 12px;
    }
    .post-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .post-meta a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }
    .post-meta a:hover {
      text-decoration: underline;
    }
    .post-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .post-body {
      font-size: 14px;
      color: var(--text-muted);
      white-space: pre-wrap;
      margin-bottom: 8px;
    }
    .post-actions {
      display: flex;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
    }
    .post-action-btn {
      background: transparent;
      border: none;
      padding: 4px 8px;
      border-radius: 2px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .post-action-btn:hover {
      background: var(--hover);
      color: var(--text);
    }
    .post-action-btn.danger {
      color: var(--danger);
    }

    /* REPLIES */
    .replies-container {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .reply-box {
      margin-bottom: 12px;
    }
    .reply-input {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 13px;
      resize: vertical;
      min-height: 80px;
      margin-bottom: 8px;
    }
    .reply-item {
      padding: 8px 0;
      border-left: 2px solid var(--border);
      padding-left: 12px;
      margin-bottom: 8px;
    }
    .reply-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .reply-text {
      font-size: 14px;
      color: var(--text);
      white-space: pre-wrap;
    }

    /* MODERATOR PANEL */
    .mod-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 16px;
      margin: 16px 20px;
    }
    .mod-panel-header {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mod-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .mod-item-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .mod-item-content {
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--text);
    }
    .mod-actions {
      display: flex;
      gap: 8px;
    }
    .btn-mod {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-mod-warn {
      background: #ffa500;
      color: white;
    }
    .btn-mod-delete {
      background: var(--danger);
      color: white;
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -260px;
        transition: left 0.3s;
        z-index: 100;
      }
      .sidebar.mobile-open {
        left: 0;
      }
      .main-content {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <!-- AUTH VIEW -->
  <div id="authView" class="auth-container">
    <div class="auth-box">
      <div class="auth-logo">Khat</div>
      <p class="auth-subtitle">KIIT Community Forum</p>
      
      <!-- Login Form -->
      <div id="loginForm">
        <input id="loginEmail" class="auth-input" type="email" placeholder="you@kiit.ac.in">
        <input id="loginPassword" class="auth-input" type="password" placeholder="Password">
        <div id="authStatus" class="auth-status"></div>
        <button class="auth-btn auth-btn-primary" onclick="login()">Log In</button>
        <button class="auth-btn auth-btn-secondary" onclick="loginWithGoogle()">Continue with Google</button>
        <div class="auth-toggle">
          Don't have an account? <a onclick="toggleAuthMode()">Sign up</a>
        </div>
      </div>

      <!-- Signup Form -->
      <div id="signupForm" class="hidden">
        <input id="signupEmail" class="auth-input" type="email" placeholder="you@kiit.ac.in">
        <input id="signupPassword" class="auth-input" type="password" placeholder="Password (min 6 characters)">
        <div id="signupStatus" class="auth-status"></div>
        <button class="auth-btn auth-btn-primary" onclick="signUp()">Sign Up</button>
        <button class="auth-btn auth-btn-secondary" onclick="loginWithGoogle()">Continue with Google</button>
        <div class="auth-toggle">
          Already have an account? <a onclick="toggleAuthMode()">Log in</a>
        </div>
      </div>

      <!-- Username Setup (shown after first Google login or signup) -->
      <div id="usernameForm" class="hidden username-setup">
        <h2>Choose Your Username</h2>
        <p>This will be permanent and visible to everyone</p>
        <input id="usernameInput" class="auth-input" type="text" placeholder="username" maxlength="24">
        <div id="usernameStatus" class="auth-status"></div>
        <button class="auth-btn auth-btn-primary" onclick="saveUsername()">Continue</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP VIEW -->
  <div id="appView" class="hidden">
    <div class="app-container">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">Khat</div>
        
        <div class="sidebar-section">
          <div class="sidebar-title">Feed</div>
          <button class="sidebar-item active" onclick="setCommunity('all')" id="feedAll">
            <span class="sidebar-icon">🏠</span>
            <span>All Posts</span>
          </button>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">Communities</div>
          <input class="sidebar-search" id="communitySearch" placeholder="Search communities" oninput="renderCommunities()">
          <div id="communityList"></div>
        </div>

        <!-- Moderator Section -->
        <div id="modSidebarSection" class="sidebar-section hidden">
          <div class="sidebar-title">Moderation</div>
          <button class="sidebar-item" onclick="showModPanel()" id="modPanelBtn">
            <span class="sidebar-icon">🛡️</span>
            <span>Mod Dashboard</span>
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Header -->
        <header class="header">
          <div class="header-left">
            <div class="header-community" id="currentCommunityName">All Posts</div>
          </div>
          <div class="header-right">
            <div class="header-user">
              <span id="usernameDisplay"></span>
              <span id="modBadge" class="mod-badge hidden">MOD</span>
            </div>
            <button class="btn-logout" onclick="logout()">Logout</button>
          </div>
        </header>

        <!-- Create Post -->
        <div class="create-post" id="createPostCard">
          <div class="create-post-header">
            <div class="create-post-avatar" id="userAvatar">K</div>
            <input class="create-post-input" placeholder="Create Post" onclick="expandCreatePost()" readonly>
          </div>
          <div class="create-post-body" id="createPostBody">
            <select class="create-post-select" id="communitySelect">
              <option value="">Select a community</option>
            </select>
            <input class="auth-input" id="postTitle" placeholder="Title" style="margin-bottom: 12px;">
            <textarea class="create-post-textarea" id="postContent" placeholder="Text (optional)"></textarea>
            <div class="create-post-actions">
              <button class="btn-cancel" onclick="collapseCreatePost()">Cancel</button>
              <button class="btn-post" onclick="createPost()">Post</button>
            </div>
          </div>
        </div>

        <!-- Moderator Panel -->
        <div id="modPanel" class="mod-panel hidden">
          <div class="mod-panel-header">
            <span>🛡️</span>
            <span>Moderator Dashboard</span>
          </div>
          <div id="modFeed"></div>
        </div>

        <!-- Posts Feed -->
        <div class="posts-feed" id="postsFeed"></div>
      </main>
    </div>
  </div>

  <script>
    (() => {
      const supabaseClient = window.supabase.createClient(
        "https://sveexlibgersvtsyggmj.supabase.co",
        "sb_publishable_J-EXRUHIOncT4Q15Ha5ohQ_JPvOMDBR"
      );

      const COMMUNITIES = [
        { id: "k/general", name: "General", icon: "💬" },
        { id: "k/tech", name: "Tech", icon: "💻" },
        { id: "k/chess", name: "Chess", icon: "♟️" },
        { id: "k/sports", name: "Sports", icon: "⚽" },
        { id: "k/music", name: "Music", icon: "🎵" },
        { id: "k/study", name: "Study", icon: "📚" },
        { id: "k/placements", name: "Placements", icon: "💼" },
        { id: "k/memes", name: "Memes", icon: "😂" }
      ];

      const FALLBACK_BAD_WORDS = ["fuck","shit","bitch","madarchod","bhenchod","chutiya"];

      let user = null;
      let profile = null;
      let currentCommunity = "all";
      let posts = [];
      let userVotes = {};
      let votesByPost = {};
      let hiddenPosts = new Set();
      let hiddenReplies = new Set();
      let profanityWords = [...FALLBACK_BAD_WORDS];
      let isModerator = false;
      let showingModPanel = false;

      // AUTH FUNCTIONS
      function setAuthStatus(message, isError, targetId = "authStatus") {
        const el = document.getElementById(targetId);
        if (!el) return;
        el.textContent = message || "";
        el.style.color = isError ? "#ea0027" : "#818384";
      }

      function toggleAuthMode() {
        document.getElementById("loginForm").classList.toggle("hidden");
        document.getElementById("signupForm").classList.toggle("hidden");
      }

      function showAuth() {
        document.getElementById("authView").classList.remove("hidden");
        document.getElementById("appView").classList.add("hidden");
      }

      function showApp() {
        document.getElementById("authView").classList.add("hidden");
        document.getElementById("appView").classList.remove("hidden");
      }

      function showUsernameSetup() {
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("signupForm").classList.add("hidden");
        document.getElementById("usernameForm").classList.remove("hidden");
      }

      function kiitEmail(email) {
        return String(email || "").toLowerCase().endsWith("@kiit.ac.in");
      }

      async function signUp() {
        try {
          setAuthStatus("Creating account...", false, "signupStatus");
          const email = document.getElementById("signupEmail").value.trim().toLowerCase();
          const password = document.getElementById("signupPassword").value;

          if (!kiitEmail(email)) {
            return setAuthStatus("Please use a @kiit.ac.in email address", true, "signupStatus");
          }
          if (password.length < 6) {
            return setAuthStatus("Password must be at least 6 characters", true, "signupStatus");
          }

          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password
          });

          if (error) return setAuthStatus(error.message, true, "signupStatus");
          
          if (data.user) {
            setAuthStatus("Account created! Please check your email to verify.", false, "signupStatus");
            setTimeout(() => {
              document.getElementById("signupForm").classList.add("hidden");
              document.getElementById("loginForm").classList.remove("hidden");
            }, 2000);
          }
        } catch (err) {
          console.error(err);
          setAuthStatus("Signup failed. Please try again.", true, "signupStatus");
        }
      }

      async function login() {
        try {
          setAuthStatus("Logging in...", false, "authStatus");
          const email = document.getElementById("loginEmail").value.trim().toLowerCase();
          const password = document.getElementById("loginPassword").value;

          if (!kiitEmail(email)) {
            return setAuthStatus("Only @kiit.ac.in users can login", true, "authStatus");
          }

          const { data, error } = await supabaseClient.auth.signInWithPassword({ 
            email, 
            password 
          });

          if (error) return setAuthStatus(error.message, true, "authStatus");
          
          setAuthStatus("");
          await bootstrap();
        } catch (err) {
          console.error(err);
          setAuthStatus("Login failed. Please try again.", true, "authStatus");
        }
      }

      async function loginWithGoogle() {
        try {
          setAuthStatus("Redirecting to Google...", false, "authStatus");
          const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: "google",
            options: {
              redirectTo: window.location.href,
              queryParams: {
                hd: "kiit.ac.in",
                prompt: "select_account"
              }
            }
          });
          if (error) setAuthStatus(error.message, true, "authStatus");
        } catch (err) {
          console.error(err);
          setAuthStatus("Google login failed. Please try again.", true, "authStatus");
        }
      }

      async function logout() {
        await supabaseClient.auth.signOut();
        user = null;
        profile = null;
        showAuth();
      }

      async function saveUsername() {
        try {
          const username = document.getElementById("usernameInput").value.trim().toLowerCase();
          
          if (username.length < 3) {
            return setAuthStatus("Username must be at least 3 characters", true, "usernameStatus");
          }
          if (!/^[a-z0-9_]+$/.test(username)) {
            return setAuthStatus("Username can only contain letters, numbers, and underscores", true, "usernameStatus");
          }

          // Check if username is taken
          const { data: existing } = await supabaseClient
            .from("profiles")
            .select("id")
            .eq("username", username)
            .maybeSingle();

          if (existing) {
            return setAuthStatus("Username already taken", true, "usernameStatus");
          }

          // Create profile
          const { error } = await supabaseClient
            .from("profiles")
            .insert([{
              id: user.id,
              email: user.email,
              username: username
            }]);

          if (error) {
            return setAuthStatus(error.message, true, "usernameStatus");
          }

          await bootstrap();
        } catch (err) {
          console.error(err);
          setAuthStatus("Failed to save username. Please try again.", true, "usernameStatus");
        }
      }

      async function bootstrap() {
        const { data } = await supabaseClient.auth.getUser();
        if (!data.user) return showAuth();

        if (!kiitEmail(data.user.email)) {
          await supabaseClient.auth.signOut();
          alert("Only @kiit.ac.in users are allowed.");
          return showAuth();
        }

        user = data.user;

        // Check if profile exists
        const { data: p } = await supabaseClient
          .from("profiles")
          .select("*")
          .eq("id", user.id)
          .maybeSingle();

        if (!p) {
          // Show username setup
          showUsernameSetup();
          return;
        }

        profile = p;

        // Check moderator status
        const { data: mod } = await supabaseClient
          .from("moderators")
          .select("id")
          .eq("user_id", user.id)
          .maybeSingle();

        isModerator = !!mod;

        // Update UI
        document.getElementById("usernameDisplay").textContent = `u/${profile.username}`;
        document.getElementById("modBadge").classList.toggle("hidden", !isModerator);
        document.getElementById("modSidebarSection").classList.toggle("hidden", !isModerator);
        
        const avatar = document.getElementById("userAvatar");
        avatar.textContent = profile.username.charAt(0).toUpperCase();

        await loadProfanity();
        renderCommunities();
        fillCommunitySelect();
        showApp();
        await refreshFeed();
      }

      async function loadProfanity() {
        const { data } = await supabaseClient
          .from("profanity_terms")
          .select("term")
          .eq("is_active", true);
        if (data && data.length) {
          profanityWords = data.map(x => String(x.term || "").toLowerCase());
        }
      }

      function hasBadWords(text) {
        const l = String(text || "").toLowerCase();
        return profanityWords.some(w => l.includes(w));
      }

      function fillCommunitySelect() {
        const select = document.getElementById("communitySelect");
        select.innerHTML = `<option value="">Select a community</option>` +
          COMMUNITIES.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join("");
      }

      function renderCommunities() {
        const query = document.getElementById("communitySearch").value.trim().toLowerCase();
        const filtered = !query ? COMMUNITIES : COMMUNITIES.filter(c => 
          c.name.toLowerCase().includes(query) || c.id.includes(query)
        );

        const list = document.getElementById("communityList");
        list.innerHTML = filtered.map(c => `
          <button class="sidebar-item ${currentCommunity === c.id ? 'active' : ''}" 
                  onclick="setCommunity('${c.id}')">
            <span class="sidebar-icon">${c.icon}</span>
            <span>${c.name}</span>
          </button>
        `).join("");
      }

      function setCommunity(communityId) {
        currentCommunity = communityId;
        showingModPanel = false;
        
        // Update sidebar
        document.querySelectorAll('.sidebar-item').forEach(item => {
          item.classList.remove('active');
        });
        
        if (communityId === 'all') {
          document.getElementById('feedAll').classList.add('active');
          document.getElementById('currentCommunityName').textContent = 'All Posts';
        } else {
          const comm = COMMUNITIES.find(c => c.id === communityId);
          document.getElementById('currentCommunityName').textContent = comm ? `${comm.icon} ${comm.name}` : communityId;
        }
        
        document.getElementById('modPanel').classList.add('hidden');
        document.getElementById('createPostCard').classList.remove('hidden');
        renderCommunities();
        renderFeed();
      }

      function showModPanel() {
        showingModPanel = true;
        currentCommunity = null;
        
        document.querySelectorAll('.sidebar-item').forEach(item => {
          item.classList.remove('active');
        });
        document.getElementById('modPanelBtn').classList.add('active');
        
        document.getElementById('currentCommunityName').textContent = '🛡️ Moderator Dashboard';
        document.getElementById('modPanel').classList.remove('hidden');
        document.getElementById('createPostCard').classList.add('hidden');
        document.getElementById('postsFeed').innerHTML = '';
        
        renderModFeed();
      }

      function expandCreatePost() {
        document.getElementById('createPostBody').classList.add('active');
      }

      function collapseCreatePost() {
        document.getElementById('createPostBody').classList.remove('active');
        document.getElementById('postTitle').value = '';
        document.getElementById('postContent').value = '';
        document.getElementById('communitySelect').value = '';
      }

      async function createPost() {
        const title = document.getElementById("postTitle").value.trim();
        const content = document.getElementById("postContent").value.trim();
        const community = document.getElementById("communitySelect").value;

        if (!title) return alert("Please add a title");
        if (!community) return alert("Please select a community");
        if (hasBadWords(title + " " + content)) {
          return alert("Please keep language respectful");
        }

        const { error } = await supabaseClient.from("posts").insert([{
          title,
          content,
          community,
          user_id: user.id,
          user_email: user.email,
          username: profile.username,
          anonymous_id: user.id,
          anonymous_name: profile.username,
          created_at: new Date().toISOString()
        }]);

        if (error) return alert(error.message);

        collapseCreatePost();
        await refreshFeed();
      }

      async function refreshFeed() {
        const { data: postData } = await supabaseClient
          .from("posts")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(100);

        posts = postData || [];
        await hydrateState();
        if (!showingModPanel) {
          renderFeed();
        } else {
          renderModFeed();
        }
      }

      async function hydrateState() {
        userVotes = {};
        votesByPost = {};
        hiddenPosts = new Set();
        hiddenReplies = new Set();

        const ids = posts.map(p => p.id);
        if (!ids.length) return;

        const [{ data: votes }, { data: myVotes }, { data: mods }] = await Promise.all([
          supabaseClient.from("post_votes").select("post_id,vote_value").in("post_id", ids),
          supabaseClient.from("post_votes").select("post_id,vote_value").eq("user_id", user.id).in("post_id", ids),
          supabaseClient.from("moderation_actions").select("target_type,target_id").eq("action", "hide")
        ]);

        (votes || []).forEach(v => {
          if (!votesByPost[v.post_id]) votesByPost[v.post_id] = { up: 0, down: 0 };
          if (v.vote_value === 1) votesByPost[v.post_id].up += 1;
          if (v.vote_value === -1) votesByPost[v.post_id].down += 1;
        });

        (myVotes || []).forEach(v => {
          userVotes[v.post_id] = v.vote_value;
        });

        (mods || []).forEach(m => {
          if (m.target_type === "post") hiddenPosts.add(Number(m.target_id));
          if (m.target_type === "reply") hiddenReplies.add(Number(m.target_id));
        });
      }

      function score(post) {
        const v = votesByPost[post.id] || { up: 0, down: 0 };
        const ageHr = Math.max(1, (Date.now() - new Date(post.created_at).getTime()) / 36e5);
        return (v.up - v.down) * 3 + (8 / ageHr);
      }

      function renderFeed() {
        const feed = document.getElementById("postsFeed");
        
        const visible = posts
          .filter(p => !hiddenPosts.has(p.id))
          .filter(p => currentCommunity === "all" || p.community === currentCommunity)
          .sort((a, b) => score(b) - score(a));

        if (!visible.length) {
          feed.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📭</div>
              <div>No posts yet. Be the first to post!</div>
            </div>
          `;
          return;
        }

        feed.innerHTML = visible.map(p => {
          const v = votesByPost[p.id] || { up: 0, down: 0 };
          const my = userVotes[p.id] || 0;
          const comm = COMMUNITIES.find(c => c.id === p.community);

          return `
            <article class="post-card">
              <div class="post-vote">
                <button class="vote-btn ${my === 1 ? 'upvoted' : ''}" onclick="votePost(${p.id}, 1)">▲</button>
                <div class="vote-count">${v.up - v.down}</div>
                <button class="vote-btn ${my === -1 ? 'downvoted' : ''}" onclick="votePost(${p.id}, -1)">▼</button>
              </div>
              <div class="post-content">
                <div class="post-meta">
                  <a onclick="setCommunity('${p.community}')">${comm ? comm.icon + ' ' + comm.name : p.community}</a>
                  • Posted by u/${escapeHtml(p.username || 'unknown')} 
                  • ${timeAgo(p.created_at)}
                </div>
                <h3 class="post-title">${escapeHtml(p.title || '')}</h3>
                ${p.content ? `<div class="post-body">${escapeHtml(p.content)}</div>` : ''}
                <div class="post-actions">
                  <button class="post-action-btn" onclick="toggleReplies(${p.id})">
                    💬 Reply
                  </button>
                  ${isModerator ? `
                    <button class="post-action-btn" onclick="warnUser(${p.id})">⚠️ Warn</button>
                    <button class="post-action-btn danger" onclick="deletePost(${p.id})">🗑️ Delete</button>
                  ` : ''}
                </div>
                <div id="replies-${p.id}" class="hidden"></div>
              </div>
            </article>
          `;
        }).join("");
      }

      async function votePost(postId, val) {
        const current = userVotes[postId] || 0;
        
        if (current === val) {
          // Remove vote
          await supabaseClient
            .from("post_votes")
            .delete()
            .eq("post_id", postId)
            .eq("user_id", user.id);
        } else {
          // Add or update vote
          await supabaseClient
            .from("post_votes")
            .upsert([{
              post_id: postId,
              user_id: user.id,
              vote_value: val,
              created_at: new Date().toISOString()
            }], { onConflict: "post_id,user_id" });
        }

        await refreshFeed();
      }

      async function toggleReplies(postId) {
        const container = document.getElementById(`replies-${postId}`);
        
        if (container.classList.contains('hidden')) {
          container.classList.remove('hidden');
          await loadReplies(postId);
        } else {
          container.classList.add('hidden');
        }
      }

      async function loadReplies(postId) {
        const { data } = await supabaseClient
          .from("replies")
          .select("*")
          .eq("post_id", postId)
          .order("created_at", { ascending: true });

        const container = document.getElementById(`replies-${postId}`);
        const replies = (data || []).filter(r => !hiddenReplies.has(r.id));

        container.innerHTML = `
          <div class="replies-container">
            <div class="reply-box">
              <textarea class="reply-input" id="replytext-${postId}" placeholder="What are your thoughts?"></textarea>
              <button class="btn-post" style="max-width: 120px;" onclick="sendReply(${postId})">Reply</button>
            </div>
            ${replies.map(r => `
              <div class="reply-item">
                <div class="reply-meta">
                  u/${escapeHtml(r.username || 'unknown')} • ${timeAgo(r.created_at)}
                </div>
                <div class="reply-text">${escapeHtml(r.content || '')}</div>
                ${isModerator ? `
                  <div class="post-actions" style="margin-top: 4px;">
                    <button class="post-action-btn danger" onclick="deleteReply(${r.id}, ${postId})">Delete</button>
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        `;
      }

      async function sendReply(postId) {
        const input = document.getElementById(`replytext-${postId}`);
        const content = input.value.trim();

        if (!content) return;
        if (hasBadWords(content)) {
          return alert("Please keep language respectful");
        }

        const { error } = await supabaseClient.from("replies").insert([{
          post_id: postId,
          content,
          user_id: user.id,
          user_email: user.email,
          username: profile.username,
          anonymous_id: user.id,
          anonymous_name: profile.username,
          created_at: new Date().toISOString()
        }]);

        if (error) return alert(error.message);

        input.value = "";
        await loadReplies(postId);
      }

      async function deletePost(postId) {
        if (!isModerator) return;
        if (!confirm('Delete this post?')) return;

        await supabaseClient
          .from("moderation_actions")
          .insert([{
            target_type: "post",
            target_id: postId,
            action: "hide",
            moderator_user_id: user.id
          }]);

        await supabaseClient.from("posts").delete().eq("id", postId);
        await supabaseClient.from("replies").delete().eq("post_id", postId);
        await refreshFeed();
      }

      async function deleteReply(replyId, postId) {
        if (!isModerator) return;
        if (!confirm('Delete this reply?')) return;

        await supabaseClient
          .from("moderation_actions")
          .insert([{
            target_type: "reply",
            target_id: replyId,
            action: "hide",
            moderator_user_id: user.id
          }]);

        await supabaseClient.from("replies").delete().eq("id", replyId);
        await loadReplies(postId);
      }

      async function warnUser(postId) {
        if (!isModerator) return;
        
        const p = posts.find(x => Number(x.id) === Number(postId));
        if (!p) return;

        const reason = prompt(`Warning reason for u/${p.username}:`);
        if (!reason || !reason.trim()) return;

        const { error } = await supabaseClient.from("moderation_warnings").insert([{
          target_user_id: p.user_id,
          target_email: p.user_email,
          post_id: p.id,
          reason,
          moderator_user_id: user.id
        }]);

        if (error) {
          alert(error.message);
        } else {
          alert("Warning sent to user");
        }
      }

      function renderModFeed() {
        const feed = document.getElementById("modFeed");
        const recent = posts.slice(0, 20);

        if (!recent.length) {
          feed.innerHTML = '<div class="empty-state">No posts to moderate</div>';
          return;
        }

        feed.innerHTML = recent.map(p => `
          <div class="mod-item">
            <div class="mod-item-meta">
              u/${escapeHtml(p.username || 'unknown')} (${escapeHtml(p.user_email || '')})
              • ${p.community} • ${timeAgo(p.created_at)}
            </div>
            <div class="mod-item-content">
              <strong>${escapeHtml(p.title || '')}</strong>
              ${p.content ? '<br>' + escapeHtml(p.content.slice(0, 150)) + (p.content.length > 150 ? '...' : '') : ''}
            </div>
            <div class="mod-actions">
              <button class="btn-mod btn-mod-warn" onclick="warnUser(${p.id})">⚠️ Warn User</button>
              <button class="btn-mod btn-mod-delete" onclick="deletePost(${p.id})">🗑️ Delete Post</button>
            </div>
          </div>
        `).join('');
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
      }

      function timeAgo(timestamp) {
        const seconds = Math.floor((Date.now() - new Date(timestamp).getTime()) / 1000);
        
        if (seconds < 60) return 'just now';
        if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
        if (seconds < 86400) return Math.floor(seconds / 3600) + 'h';
        if (seconds < 2592000) return Math.floor(seconds / 86400) + 'd';
        if (seconds < 31536000) return Math.floor(seconds / 2592000) + 'mo';
        return Math.floor(seconds / 31536000) + 'y';
      }

      // Global functions
      window.signUp = signUp;
      window.login = login;
      window.loginWithGoogle = loginWithGoogle;
      window.logout = logout;
      window.saveUsername = saveUsername;
      window.toggleAuthMode = toggleAuthMode;
      window.setCommunity = setCommunity;
      window.showModPanel = showModPanel;
      window.expandCreatePost = expandCreatePost;
      window.collapseCreatePost = collapseCreatePost;
      window.createPost = createPost;
      window.votePost = votePost;
      window.toggleReplies = toggleReplies;
      window.sendReply = sendReply;
      window.deletePost = deletePost;
      window.deleteReply = deleteReply;
      window.warnUser = warnUser;
      window.renderCommunities = renderCommunities;

      // Auth state listener
      supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (event === 'SIGNED_IN') {
          await bootstrap();
        } else if (event === 'SIGNED_OUT') {
          showAuth();
        }
      });

      // Initialize
      bootstrap();

      // Auto-refresh feed every 30 seconds
      setInterval(refreshFeed, 30000);
    })();
  </script>
</body>
</html>
