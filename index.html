<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khat - KIIT Community Forum</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b1116;
      --panel: #131b22;
      --panel-soft: #1a2430;
      --text: #dbe3ec;
      --muted: #8da0b3;
      --green: #2e8b57;
      --green-soft: #3ea769;
      --danger: #e15b64;
      --border: #273341;
    }
    body {
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: linear-gradient(180deg, #0a0f14, #0d151c);
      color: var(--text);
    }
    .hidden { display: none !important; }
    .shell { max-width: 1240px; margin: 0 auto; padding: 18px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .auth-wrap { max-width: 460px; margin: 8vh auto 0; padding: 20px; }
    .logo { color: #b8f5c8; font-size: 1.6rem; font-weight: 800; }
    .tag { color: var(--muted); margin-top: 6px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .stack { display: grid; gap: 10px; margin-top: 14px; }
    input, textarea, select, button {
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: #0f161d;
      padding: 10px 12px;
      width: 100%;
    }
    button {
      background: linear-gradient(180deg, var(--green-soft), var(--green));
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary { background: #1e2935; }
    button.danger { background: linear-gradient(180deg, #ef6f78, #c84652); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      margin-bottom: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .layout {
      display: grid;
      grid-template-columns: 250px 1fr 300px;
      gap: 14px;
    }
    .side, .right { padding: 12px; height: fit-content; }
    .side h3, .right h3 { font-size: 0.95rem; margin-bottom: 10px; }
    .community-btn {
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
      background: #17212b;
      border: 1px solid var(--border);
    }
    .community-btn.active {
      border-color: #59c980;
      box-shadow: 0 0 0 2px rgba(89, 201, 128, 0.12);
    }
    .feed-top { padding: 12px; margin-bottom: 10px; }
    .post {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 10px;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
    }
    .vote-box {
      background: #101820;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      text-align: center;
    }
    .meta { font-size: 0.8rem; color: var(--muted); }
    .title { margin: 4px 0 8px; font-size: 1rem; }
    .content { color: #d4dde7; white-space: pre-wrap; line-height: 1.38; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .reply { margin-top: 8px; margin-left: 12px; padding: 8px; border-left: 2px solid #355168; background: #10171e; border-radius: 8px; }
    .moderator-dashboard { margin-top: 14px; padding: 12px; }
    .notice { color: var(--muted); font-size: 0.9rem; }
    @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="authView" class="card auth-wrap">
    <div class="logo">Khat</div>
    <p class="tag">KIIT campus boards</p>
    <div class="stack">
      <input id="email" type="email" placeholder="you@kiit.ac.in">
      <input id="password" type="password" placeholder="Password">
      <input id="username" maxlength="24" placeholder="Choose username (signup only)">
      <p id="authStatus" class="notice"></p>
      <div class="row">
        <button onclick="signUp()">Sign Up</button>
        <button class="secondary" onclick="login()">Log In</button>
      </div>
      <button class="secondary" onclick="loginWithGoogle()">Continue with Google</button>
      <p class="notice">Only @kiit.ac.in accounts are allowed.</p>
    </div>
  </div>

  <div id="appView" class="shell hidden">
    <header class="card topbar">
      <div>
        <div class="logo">Khat</div>
        <div class="meta">college boards inspired by imageboards + forums</div>
      </div>
      <div class="top-actions">
        <span class="pill" id="userPill"></span>
        <span class="pill" id="modPill">member</span>
        <button class="secondary" onclick="logout()">Logout</button>
      </div>
    </header>

    <main class="layout">
      <aside class="card side">
        <h3>Communities</h3>
        <input id="communitySearch" placeholder="Search communities" oninput="renderCommunities()">
        <div style="margin-top: 10px;" id="communityList"></div>
      </aside>

      <section>
        <div class="card feed-top">
          <div class="row">
            <select id="communitySelect" style="max-width: 220px;"></select>
            <input id="postTitle" placeholder="Post title">
          </div>
          <div style="margin-top: 10px;">
            <textarea id="postContent" rows="3" maxlength="700" placeholder="Write your post..."></textarea>
          </div>
          <div class="row" style="margin-top: 10px;">
            <button style="max-width: 170px;" onclick="createPost()">Create Post</button>
          </div>
        </div>
        <div id="feed"></div>
      </section>

      <aside class="card right">
        <h3>About</h3>
        <p class="notice">Local KIIT forum with persistent usernames, voting, replies, and moderation.</p>
        <div id="moderatorDashboard" class="moderator-dashboard hidden">
          <h3 style="margin-bottom:8px;">Moderator Dashboard</h3>
          <div id="modFeed"></div>
        </div>
      </aside>
    </main>
  </div>

  <script>
    (() => {
      const supabaseClient = window.supabase.createClient(
        "https://sveexlibgersvtsyggmj.supabase.co",
        "sb_publishable_J-EXRUHIOncT4Q15Ha5ohQ_JPvOMDBR"
      );

      const COMMUNITIES = ["k/general", "k/tech", "k/chess", "k/sports", "k/music", "k/study", "k/placements", "k/memes"];
      const FALLBACK_BAD_WORDS = ["fuck","shit","bitch","madarchod","bhenchod","chutiya","হারামি","ମାଗି","ହରାମି"];

      let user = null;
      let profile = null;
      let currentCommunity = "all";
      let posts = [];
      let userVotes = {};
      let votesByPost = {};
      let hiddenPosts = new Set();
      let hiddenReplies = new Set();
      let profanityWords = [...FALLBACK_BAD_WORDS];
      let isModerator = false;
      const authStatusEl = document.getElementById("authStatus");

      function setAuthStatus(message, isError) {
        if (!authStatusEl) return;
        authStatusEl.textContent = message || "";
        authStatusEl.style.color = isError ? "#ff9aa2" : "var(--muted)";
      }

      function showAuth() {
        document.getElementById("authView").classList.remove("hidden");
        document.getElementById("appView").classList.add("hidden");
      }

      function showApp() {
        document.getElementById("authView").classList.add("hidden");
        document.getElementById("appView").classList.remove("hidden");
      }

      function kiitEmail(email) {
        return String(email || "").toLowerCase().endsWith("@kiit.ac.in");
      }

      async function signUp() {
        try {
          setAuthStatus("Creating account...");
          const email = document.getElementById("email").value.trim().toLowerCase();
          const password = document.getElementById("password").value;
          const username = document.getElementById("username").value.trim().toLowerCase();
          if (!kiitEmail(email)) return setAuthStatus("Use a valid @kiit.ac.in email.", true);
          if (password.length < 6) return setAuthStatus("Password must be at least 6 characters.", true);
          if (username.length < 3) return setAuthStatus("Username must be at least 3 characters.", true);

          const { data: uTaken } = await supabaseClient.from("profiles").select("id").eq("username", username).maybeSingle();
          if (uTaken) return setAuthStatus("Username already taken.", true);

          const { data, error } = await supabaseClient.auth.signUp({
            email, password, options: { data: { username } }
          });
          if (error) return setAuthStatus(error.message, true);
          if (!data.user) return setAuthStatus("Check your email for verification, then login.", false);

          await ensureProfile(data.user, username);
          setAuthStatus("");
          await bootstrap();
        } catch (err) {
          console.error(err);
          setAuthStatus("Signup failed. Check configuration and try again.", true);
        }
      }

      async function login() {
        try {
          setAuthStatus("Logging in...");
          const email = document.getElementById("email").value.trim().toLowerCase();
          const password = document.getElementById("password").value;
          if (!kiitEmail(email)) return setAuthStatus("Only @kiit.ac.in users can login.", true);
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) return setAuthStatus(error.message, true);
          setAuthStatus("");
          await bootstrap();
        } catch (err) {
          console.error(err);
          setAuthStatus("Login failed. Please retry.", true);
        }
      }

      async function loginWithGoogle() {
        try {
          setAuthStatus("Redirecting to Google...");
          const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: "google",
            options: {
              redirectTo: window.location.href,
              queryParams: {
                hd: "kiit.ac.in",
                prompt: "select_account"
              }
            }
          });
          if (error) setAuthStatus(error.message, true);
        } catch (err) {
          console.error(err);
          setAuthStatus("Google login setup is incomplete. Check provider configuration.", true);
        }
      }

      async function logout() {
        await supabaseClient.auth.signOut();
        showAuth();
      }

      async function ensureProfile(sUser, forcedUsername) {
        const { data: existing } = await supabaseClient.from("profiles").select("id").eq("id", sUser.id).maybeSingle();
        if (existing) return;
        const fromMeta = sUser.user_metadata && sUser.user_metadata.username;
        const fallback = (sUser.email || "kiit_user").split("@")[0];
        const username = String(forcedUsername || fromMeta || fallback).toLowerCase().replace(/[^a-z0-9_]/g, "_").slice(0, 24);
        await supabaseClient.from("profiles").insert([{ id: sUser.id, email: sUser.email, username }]);
      }

      async function bootstrap() {
        const { data } = await supabaseClient.auth.getUser();
        if (!data.user) return showAuth();
        if (!kiitEmail(data.user.email)) {
          await supabaseClient.auth.signOut();
          return alert("Only @kiit.ac.in users are allowed.");
        }

        user = data.user;
        await ensureProfile(user);
        const { data: p } = await supabaseClient.from("profiles").select("*").eq("id", user.id).maybeSingle();
        profile = p;
        if (!profile) return alert("Could not load profile.");

        const { data: mod } = await supabaseClient.from("moderators").select("id").eq("user_id", user.id).maybeSingle();
        isModerator = !!mod;
        document.getElementById("modPill").textContent = isModerator ? "moderator" : "member";
        document.getElementById("userPill").textContent = "@" + profile.username;
        document.getElementById("moderatorDashboard").classList.toggle("hidden", !isModerator);

        await loadProfanity();
        renderCommunities();
        fillCommunitySelect();
        showApp();
        await refreshFeed();
      }

      async function loadProfanity() {
        const { data } = await supabaseClient.from("profanity_terms").select("term").eq("is_active", true);
        if (data && data.length) profanityWords = data.map(x => String(x.term || "").toLowerCase());
      }

      function hasBadWords(text) {
        const l = String(text || "").toLowerCase();
        return profanityWords.some(w => l.includes(w));
      }

      function fillCommunitySelect() {
        const s = document.getElementById("communitySelect");
        s.innerHTML = `<option value="">Select community</option>` + COMMUNITIES.map(c => `<option value="${c}">${c}</option>`).join("");
      }

      function renderCommunities() {
        const q = document.getElementById("communitySearch").value.trim().toLowerCase();
        const list = !q ? COMMUNITIES : COMMUNITIES.filter(c => c.includes(q));
        const root = document.getElementById("communityList");
        root.innerHTML = `<button class="community-btn ${currentCommunity === "all" ? "active" : ""}" onclick="setCommunity('all')">All</button>` +
          list.map(c => `<button class="community-btn ${currentCommunity === c ? "active" : ""}" onclick="setCommunity('${c}')">${c}</button>`).join("");
      }

      async function refreshFeed() {
        const { data: postData } = await supabaseClient.from("posts").select("*").order("created_at", { ascending: false }).limit(100);
        posts = postData || [];
        await hydrateState();
        renderFeed();
        if (isModerator) renderModFeed();
      }

      async function hydrateState() {
        userVotes = {};
        votesByPost = {};
        hiddenPosts = new Set();
        hiddenReplies = new Set();
        const ids = posts.map(p => p.id);
        if (!ids.length) return;

        const [{ data: votes }, { data: myVotes }, { data: mods }] = await Promise.all([
          supabaseClient.from("post_votes").select("post_id,vote_value").in("post_id", ids),
          supabaseClient.from("post_votes").select("post_id,vote_value").eq("user_id", user.id).in("post_id", ids),
          supabaseClient.from("moderation_actions").select("target_type,target_id").eq("action", "hide")
        ]);

        (votes || []).forEach(v => {
          if (!votesByPost[v.post_id]) votesByPost[v.post_id] = { up: 0, down: 0 };
          if (v.vote_value === 1) votesByPost[v.post_id].up += 1;
          if (v.vote_value === -1) votesByPost[v.post_id].down += 1;
        });
        (myVotes || []).forEach(v => { userVotes[v.post_id] = v.vote_value; });
        (mods || []).forEach(m => {
          if (m.target_type === "post") hiddenPosts.add(Number(m.target_id));
          if (m.target_type === "reply") hiddenReplies.add(Number(m.target_id));
        });
      }

      function score(post) {
        const v = votesByPost[post.id] || { up: 0, down: 0 };
        const ageHr = Math.max(1, (Date.now() - new Date(post.created_at).getTime()) / 36e5);
        return (v.up - v.down) * 3 + (8 / ageHr);
      }

      function renderFeed() {
        const root = document.getElementById("feed");
        const visible = posts
          .filter(p => !hiddenPosts.has(p.id))
          .filter(p => currentCommunity === "all" || p.community === currentCommunity)
          .sort((a, b) => score(b) - score(a));

        if (!visible.length) {
          root.innerHTML = `<div class="card" style="padding:12px;">No posts yet.</div>`;
          return;
        }

        root.innerHTML = visible.map(p => {
          const v = votesByPost[p.id] || { up: 0, down: 0 };
          const my = userVotes[p.id] || 0;
          const title = p.title || p.content?.slice(0, 70) || "Untitled";
          return `
            <article class="post">
              <div class="vote-box">
                <button onclick="votePost(${p.id},1)">${my === 1 ? "✓ " : ""}▲</button>
                <div style="padding:6px 0;font-weight:700;">${v.up - v.down}</div>
                <button class="secondary" onclick="votePost(${p.id},-1)">${my === -1 ? "✓ " : ""}▼</button>
              </div>
              <div>
                <div class="meta">${escapeHtml(p.community || "k/general")} • posted ${timeAgo(p.created_at)} by @${escapeHtml(p.username || "kiit_user")}</div>
                <h4 class="title">${escapeHtml(title)}</h4>
                <div class="content">${escapeHtml(p.content || "")}</div>
                <div class="actions">
                  <button class="secondary" onclick="toggleReplyBox(${p.id})">Reply</button>
                  ${isModerator ? `<button class="danger" onclick="deletePost(${p.id})">Delete Post</button><button class="secondary" onclick="warnUser(${p.id})">Warn User</button>` : ""}
                </div>
                <div id="replybox-${p.id}" class="hidden" style="margin-top:8px;">
                  <textarea id="replytext-${p.id}" rows="2" placeholder="Write reply"></textarea>
                  <button style="margin-top:6px;max-width:140px;" onclick="sendReply(${p.id})">Post Reply</button>
                </div>
                <div id="replies-${p.id}" style="margin-top:8px;"></div>
              </div>
            </article>
          `;
        }).join("");

        visible.forEach(p => loadReplies(p.id));
      }

      async function createPost() {
        const title = document.getElementById("postTitle").value.trim();
        const content = document.getElementById("postContent").value.trim();
        const community = document.getElementById("communitySelect").value;
        if (!community || !content) return alert("Select community and add post content.");
        if (hasBadWords(title + " " + content)) return alert("Please keep language respectful.");

        const { error } = await supabaseClient.from("posts").insert([{
          title, content, community, user_id: user.id, user_email: user.email, username: profile.username,
          anonymous_id: user.id, anonymous_name: profile.username, created_at: new Date().toISOString()
        }]);
        if (error) return alert(error.message);
        document.getElementById("postTitle").value = "";
        document.getElementById("postContent").value = "";
        await refreshFeed();
      }

      async function votePost(postId, val) {
        const current = userVotes[postId] || 0;
        if (current === val) {
          await supabaseClient.from("post_votes").delete().eq("post_id", postId).eq("user_id", user.id);
        } else {
          await supabaseClient.from("post_votes").upsert([{
            post_id: postId, user_id: user.id, vote_value: val, created_at: new Date().toISOString()
          }], { onConflict: "post_id,user_id" });
        }
        await refreshFeed();
      }

      function toggleReplyBox(postId) {
        document.getElementById(`replybox-${postId}`).classList.toggle("hidden");
      }

      async function sendReply(postId) {
        const input = document.getElementById(`replytext-${postId}`);
        const content = input.value.trim();
        if (!content) return;
        if (hasBadWords(content)) return alert("Please keep language respectful.");

        const { error } = await supabaseClient.from("replies").insert([{
          post_id: postId, content, user_id: user.id, user_email: user.email, username: profile.username,
          anonymous_id: user.id, anonymous_name: profile.username, created_at: new Date().toISOString()
        }]);
        if (error) return alert(error.message);
        input.value = "";
        await loadReplies(postId);
      }

      async function loadReplies(postId) {
        const { data } = await supabaseClient.from("replies").select("*").eq("post_id", postId).order("created_at", { ascending: true });
        const root = document.getElementById(`replies-${postId}`);
        const rows = (data || []).filter(r => !hiddenReplies.has(r.id));
        root.innerHTML = rows.map(r => `
          <div class="reply">
            <div class="meta">@${escapeHtml(r.username || "kiit_user")} • ${timeAgo(r.created_at)}</div>
            <div class="content">${escapeHtml(r.content || "")}</div>
            ${isModerator ? `<div class="actions"><button class="danger" onclick="deleteReply(${r.id},${postId})">Delete Reply</button></div>` : ""}
          </div>
        `).join("");
      }

      async function deletePost(postId) {
        if (!isModerator) return;
        await supabaseClient.from("moderation_actions").insert([{ target_type: "post", target_id: postId, action: "hide", moderator_user_id: user.id }]);
        await supabaseClient.from("posts").delete().eq("id", postId);
        await supabaseClient.from("replies").delete().eq("post_id", postId);
        await refreshFeed();
      }

      async function deleteReply(replyId, postId) {
        if (!isModerator) return;
        await supabaseClient.from("moderation_actions").insert([{ target_type: "reply", target_id: replyId, action: "hide", moderator_user_id: user.id }]);
        await supabaseClient.from("replies").delete().eq("id", replyId);
        await loadReplies(postId);
      }

      async function warnUser(postId) {
        if (!isModerator) return;
        const p = posts.find(x => Number(x.id) === Number(postId));
        if (!p) return;
        const reason = prompt(`Warning reason for ${p.user_email || "student"}:`) || "";
        if (!reason.trim()) return;
        const { error } = await supabaseClient.from("moderation_warnings").insert([{
          target_user_id: p.user_id, target_email: p.user_email, post_id: p.id, reason, moderator_user_id: user.id
        }]);
        if (error) alert(error.message); else alert("Warning added.");
      }

      function renderModFeed() {
        const root = document.getElementById("modFeed");
        const sample = posts.slice(0, 12);
        root.innerHTML = sample.map(p => `
          <div class="card" style="padding:8px;margin-bottom:8px;">
            <div class="meta">${escapeHtml(p.user_email || "")}</div>
            <div style="margin:4px 0;">${escapeHtml((p.title || p.content || "").slice(0, 85))}</div>
            <div class="row">
              <button class="secondary" onclick="warnUser(${p.id})">Warn</button>
              <button class="danger" onclick="deletePost(${p.id})">Delete</button>
            </div>
          </div>
        `).join("");
      }

      function setCommunity(c) {
        currentCommunity = c;
        renderCommunities();
        renderFeed();
      }

      function escapeHtml(t) {
        const d = document.createElement("div");
        d.textContent = t || "";
        return d.innerHTML;
      }

      function timeAgo(ts) {
        const s = (Date.now() - new Date(ts).getTime()) / 1000;
        if (s < 60) return "just now";
        if (s < 3600) return Math.floor(s / 60) + "m ago";
        if (s < 86400) return Math.floor(s / 3600) + "h ago";
        return Math.floor(s / 86400) + "d ago";
      }

      window.signUp = signUp;
      window.login = login;
      window.loginWithGoogle = loginWithGoogle;
      window.logout = logout;
      window.setCommunity = setCommunity;
      window.createPost = createPost;
      window.votePost = votePost;
      window.toggleReplyBox = toggleReplyBox;
      window.sendReply = sendReply;
      window.deletePost = deletePost;
      window.deleteReply = deleteReply;
      window.warnUser = warnUser;
      window.renderCommunities = renderCommunities;

      window.addEventListener("error", (event) => {
        setAuthStatus("Runtime error: " + (event.message || "unknown"), true);
      });
      window.addEventListener("unhandledrejection", (event) => {
        const msg = event && event.reason && event.reason.message ? event.reason.message : "Unhandled promise rejection";
        setAuthStatus(msg, true);
      });

      supabaseClient.auth.onAuthStateChange(async () => { await bootstrap(); });
      bootstrap();
      setInterval(refreshFeed, 30000);
    })();
  </script>
</body>
</html>
