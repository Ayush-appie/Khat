<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Khat - Anonymous College Forum</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* SAME DESIGN (unchanged) */
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial;background:#0F4C21;color:#E8F5E9;}
.container{max-width:1200px;margin:auto;padding:20px;}
header{background:#1B5E20;padding:15px;margin-bottom:20px;}
h1{text-align:center;color:#A5D6A7;}
.tagline{text-align:center;color:#81C784;}
.nav{display:flex;gap:10px;justify-content:center;margin-top:10px;}
.nav button{background:#2E7D32;color:white;border:none;padding:6px 12px;cursor:pointer;}
.content{background:#1B5E20;padding:20px;margin-bottom:20px;border-radius:5px;}
textarea,input,select{width:100%;padding:10px;background:#0F4C21;color:white;border:1px solid #2E7D32;}
button{background:#2E7D32;color:white;padding:10px;border:none;margin-top:10px;cursor:pointer;}
.post{background:#0F4C21;padding:15px;margin-bottom:15px;border-radius:5px;}
.reply{margin-left:20px;background:#1B5E20;padding:10px;margin-top:5px;}
</style>
</head>

<body>

<header>
    <h1>💬 Khat</h1>
    <p class="tagline">Anonymous community • auto delete after 24h</p>
    <div class="nav" id="communityNav"></div>
</header>

<div class="container">

<div class="content">
    <h2>Create Post</h2>

    <select id="community"></select>
    <textarea id="content" maxlength="280"></textarea>

    <button onclick="createPost()">Post</button>
</div>

<div class="content">
    <h2>Posts</h2>
    <div id="posts"></div>
</div>

</div>

<script>
// ✅ YOUR SUPABASE CONNECTED
const supabase = window.supabase.createClient(
    "https://sveexlibgersvtsyggmj.supabase.co",
    "sb_publishable_J-EXRUHIOncT4Q15Ha5ohQ_JPvOMDBR"
);

// communities
const COMMUNITIES = [
    'k/general','k/chess','k/tech','k/sports','k/music','k/study'
];

let currentCommunity = "all";

// anonymous user
let userId = localStorage.getItem("anon_id");
if(!userId){
    userId="anon_"+Math.random().toString(36).substr(2,9);
    localStorage.setItem("anon_id",userId);
}

// setup UI
function init(){
    const nav=document.getElementById("communityNav");
    const select=document.getElementById("community");

    nav.innerHTML=`<button onclick="filterCommunity('all')">All</button>`;
    select.innerHTML=`<option value="">Select</option>`;

    COMMUNITIES.forEach(c=>{
        nav.innerHTML+=`<button onclick="filterCommunity('${c}')">${c}</button>`;
        select.innerHTML+=`<option value="${c}">${c}</option>`;
    });

    loadPosts();
}

// filter
function filterCommunity(c){
    currentCommunity=c;
    loadPosts();
}

// create post
async function createPost(){
    const content=document.getElementById("content").value.trim();
    const community=document.getElementById("community").value;

    if(!content||!community){
        alert("Fill all fields");
        return;
    }

    const {error}=await supabase.from("posts").insert([{
        content,
        community,
        anonymous_id:userId,
        anonymous_name:"Anon",
        created_at:new Date().toISOString()
    }]);

    if(error){
        alert(error.message);
        return;
    }

    document.getElementById("content").value="";
    loadPosts();
}

// load posts
async function loadPosts(){
    let query=supabase
        .from("posts")
        .select("*")
        .order("created_at",{ascending:false})
        .limit(50);

    if(currentCommunity!=="all"){
        query=query.eq("community",currentCommunity);
    }

    const {data,error}=await query;

    if(error){
        console.error(error);
        return;
    }

    const div=document.getElementById("posts");

    if(!data.length){
        div.innerHTML="<p>No posts</p>";
        return;
    }

    div.innerHTML=data.map(p=>`
        <div class="post">
            <small>${p.community} • ${timeAgo(p.created_at)}</small>
            <p>${escapeHtml(p.content)}</p>

            <button onclick="toggleReply(${p.id})">Reply</button>

            <div id="reply-${p.id}" style="display:none">
                <textarea id="reply-text-${p.id}"></textarea>
                <button onclick="sendReply(${p.id})">Send</button>
            </div>

            <div id="replies-${p.id}"></div>
        </div>
    `).join("");

    data.forEach(p=>loadReplies(p.id));
}

// replies
async function sendReply(postId){
    const text=document.getElementById(`reply-text-${postId}`).value;

    if(!text){
        alert("empty");
        return;
    }

    await supabase.from("replies").insert([{
        post_id:postId,
        content:text,
        anonymous_id:userId,
        anonymous_name:"Anon",
        created_at:new Date().toISOString()
    }]);

    loadReplies(postId);
}

// load replies
async function loadReplies(postId){
    const {data}=await supabase
        .from("replies")
        .select("*")
        .eq("post_id",postId);

    const div=document.getElementById(`replies-${postId}`);

    if(!data||!data.length){
        div.innerHTML="";
        return;
    }

    div.innerHTML=data.map(r=>`
        <div class="reply">
            <small>${timeAgo(r.created_at)}</small>
            <p>${escapeHtml(r.content)}</p>
        </div>
    `).join("");
}

// toggle
function toggleReply(id){
    const el=document.getElementById(`reply-${id}`);
    el.style.display=el.style.display==="none"?"block":"none";
}

// utils
function timeAgo(t){
    const diff=(new Date()-new Date(t))/1000;
    if(diff<60)return"just now";
    if(diff<3600)return Math.floor(diff/60)+"m";
    if(diff<86400)return Math.floor(diff/3600)+"h";
    return Math.floor(diff/86400)+"d";
}

function escapeHtml(t){
    const d=document.createElement("div");
    d.textContent=t;
    return d.innerHTML;
}

// start
init();
setInterval(loadPosts,30000);
</script>

</body>
</html>
